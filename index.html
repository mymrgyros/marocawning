var lang = "fr";
try {
var saved = localStorage.getItem("lang");
if (saved && D[saved]) lang = saved;
else if ((navigator.language || "").slice(0, 2) === "ar") lang = "ar";
else if ((navigator.language || "").slice(0, 2) === "en") lang = "en";
} catch (e) {}

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function render() {
var t = D[lang];
document.documentElement.lang = lang;
document.documentElement.dir = t.dir;
document.title = t.docTitle;
var nodes = document.querySelectorAll("[data-t]");
for (var i = 0; i < nodes.length; i++) {
var k = nodes[i].getAttribute("data-t");
nodes[i].textContent = k === "phone" ? PHONE : t[k];
}
var btns = document.querySelectorAll(".langs button");
for (var b = 0; b < btns.length; b++) btns[b].setAttribute("aria-pressed", btns[b].getAttribute("data-lang") === lang ? "true" : "false");
el("strip").innerHTML = t.strip.map(function (s) { return "<div><b>" + esc(s[0]) + "</b><span>" + esc(s[1]) + "</span></div>"; }).join("");
el("products").innerHTML = t.products.map(function (p, n) {
return '<article class="card"><div class="img" style="background:' + PROD_BG[n] + '"></div><div class="body"><h3>' + esc(p[0]) + "</h3><p>" + esc(p[1]) + "</p></div></article>";
}).join("");
el("colors").innerHTML = t.colorNames.map(function (c, n) {
return '<div><div class="sw" style="background:' + NOISE + ", " + COLOR_HEX[n] + '"></div><span>' + esc(c) + "</span></div>";
}).join("");
el("audiences").innerHTML = t.audiences.map(function (a) { return "<div><h3>" + esc(a[0]) + "</h3><p>" + esc(a[1]) + "</p></div>"; }).join("");
el("steps").innerHTML = t.steps.map(function (s, n) { return "<div><i>" + (n + 1) + "</i><b>" + esc(s[0]) + "</b><span>" + esc(s[1]) + "</span></div>"; }).join("");
var sel = el("activity");
var cur = sel.selectedIndex > 0 ? sel.selectedIndex : 0;
sel.innerHTML = t.activities.map(function (a) { return "<option>" + esc(a) + "</option>"; }).join("");
sel.selectedIndex = cur;
}

function updateMail() {
var t = D[lang];
var lines = [
t.mLabels[0] + ": " + el("company").value,
t.mLabels[1] + ": " + el("name").value,
t.mLabels[2] + ": " + el("phone").value,
t.mLabels[3] + ": " + el("activity").value,
t.mLabels[4] + ": " + el("message").value
];
var c = el("company").value;
el("send").href = "mailto:contact@marocawning.com?subject=" + encodeURIComponent(t.tag + (c ? " - " + c : "")) + "&body=" + encodeURIComponent(lines.join("\n"));
}

document.querySelectorAll(".langs button").forEach(function (b) {
b.addEventListener("click", function () {
lang = b.getAttribute("data-lang");
try { localStorage.setItem("lang", lang); } catch (e) {}
render();
updateMail();
});
});
["company", "name", "phone", "activity", "message"].forEach(function (id) {
el(id).addEventListener("input", updateMail);
el(id).addEventListener("change", updateMail);
});
el("send").addEventListener("click", updateMail);

render();
updateMail();
})();
